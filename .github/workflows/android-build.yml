name: Android build

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # packages: '' stops the action from installing its default set, which still includes
      # the long-obsolete "tools" package -- Google finally dropped it from the SDK
      # repository, so the default made sdkmanager (and the whole build) exit 1. Everything
      # actually needed is installed by the next step.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK platform & build-tools
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests (core FFT / WAV logic)
        run: ./gradlew :core:test

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ulzvu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
